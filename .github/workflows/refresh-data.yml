name: Refresh cursor dataset

on:
  schedule:
    - cron: "0 0 1 * *"
  workflow_dispatch:
    inputs:
      max_pages:
        description: "Max pages per service (safety cap)"
        required: false
        default: "5"

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Refresh dataset
        env:
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
          RAPIDAPI_HOST: ${{ secrets.RAPIDAPI_HOST }}
          MAX_PAGES: ${{ inputs.max_pages }}
        run: python scripts/refresh-data.py
      - name: Commit changes
        run: |
          if git diff --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/cursors.json
          git commit -m "chore: refresh cursor dataset"
          git push
